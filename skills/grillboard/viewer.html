<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title></title>
  <link rel="icon" href="data:,">
  <style>
    /* Theme and page layout. */
    :root {
      color-scheme: light;
      --radius: 10px; --radius-small: 5px;
      --page: #f4efe6; --card: #fffdf8; --panel: #efe8db; --border: #ddd3c0;
      --text: #2a2622; --muted: #6f6558; --accent: #b5400d; --accent-tint: #fbe9d9;
      --green: #2a7449; --green-tint: #e3f1e4; --amber: #855600; --amber-tint: #f8ecd0;
      --highlight: #fbe3cc; --violet: #6246b0; --violet-tint: #ece6f8; --line: #cdbfa6;
      --shadow: 0 6px 20px rgba(70,50,20,.10);
      --on-accent: #ffffff;
      --font-display: ui-serif, Charter, 'Iowan Old Style', 'Palatino Linotype', Georgia, serif;
      --sketch-shadow: 0 18px 48px rgba(70,50,20,.18);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        color-scheme: dark;
        --page: #1b1916; --card: #25221e; --panel: #201d1a; --border: #3e382f;
        --text: #efe9df; --muted: #ada394; --accent: #f19a63; --accent-tint: #3d2a1c;
        --green: #88cf9e; --green-tint: #203327; --amber: #f0c060; --amber-tint: #3a2f14;
        --highlight: #4a3321; --violet: #c3b2ff; --violet-tint: #2a2440; --line: #4a4337;
        --shadow: 0 6px 20px rgba(0,0,0,.45);
        --sketch-shadow: 0 18px 48px rgba(0,0,0,.55);
        --on-accent: #25221e;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--page);
      color: var(--text);
      font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      overflow-wrap: anywhere;
    }
    [hidden] { display: none !important; }
    .warning {
      padding: 12px 16px;
      border-bottom: 1px solid var(--amber);
      color: var(--amber);
      background: var(--amber-tint);
      white-space: pre-wrap;
    }
    .waiting-message { min-height: 75vh; display: grid; place-items: center; color: var(--muted); }
    .header { display: flex; justify-content: space-between; align-items: flex-start; gap: 24px; margin-bottom: 32px; }
    .heading { min-width: 0; }
    .title-line { display: flex; align-items: center; flex-wrap: wrap; gap: 12px; }
    h1 { margin: 0; font-size: 26px; line-height: 1.25; }
    .idea-text { margin: 10px 0 0; color: var(--muted); white-space: pre-wrap; }
    .progress { display: flex; align-items: center; justify-content: flex-end; gap: 10px; color: var(--muted); flex-shrink: 0; min-width: 0; max-width: 100%; padding-top: 6px; }
    .progress > span:first-child { min-width: 0; }
    .read-only-notice { margin: 8px 0 0; color: var(--muted); font-size: 12px; }
    .live-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); flex-shrink: 0; }
    .live-dot.changed { animation: live-pulse 650ms ease-out; }

    /* Tree cards and dependency lines. */
    .connectors { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; overflow: visible; }
    .connectors path { fill: none; stroke: var(--line); stroke-width: 3; stroke-linecap: round; opacity: .8; }
    .connectors path[data-secondary] { stroke-width: 1; stroke-dasharray: 5 5; vector-effect: non-scaling-stroke; opacity: 1; }
    .sockets { position: absolute; width: 1px; height: 1px; overflow: visible; pointer-events: none; z-index: 2; }
    .sockets circle { stroke: var(--card); stroke-width: 2; }
    .idea-card, .question-card { position: relative; z-index: 1; background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 14px; }
    .idea-card { width: 320px; margin: 0 auto; text-align: left; padding: 18px 20px; box-shadow: var(--shadow); }
    .caption { font-size: 12px; color: var(--muted); }
    .idea-card strong { display: block; margin-top: 4px; }
    .idea-summary { margin: 10px 0 0; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; white-space: pre-wrap; font-size: 14px; }
    .question-card { flex: 1 1 240px; width: 280px; min-width: 0; max-width: 320px; }
    .question-card.asking { border: 2px solid var(--accent); box-shadow: var(--shadow); }
    .question-card.waiting { border-style: dashed; color: var(--muted); }
    .question-card.unseen { animation: unseen-pulse 1.5s ease-in-out infinite; }
    .question-card.unseen.highlight { animation: card-highlight 1.2s ease-out, unseen-pulse 1.5s ease-in-out infinite; }
    .question-card.unseen .question-header { animation: unseen-header 1.5s ease-in-out infinite; }
    #world.far .question-card.unseen { animation: unseen-pulse 1.5s ease-in-out infinite, unseen-fill 1.5s ease-in-out infinite; }
    .question-card.unseen::after { content: attr(data-new-label); position: absolute; top: -1em; right: 12px; padding: .1em .8em; border-radius: 999px; background: var(--accent); color: var(--on-accent); border: 2px solid var(--card); font-size: max(12px, calc(11px / var(--z, 1))); white-space: nowrap; font-weight: 700; line-height: 1.6; pointer-events: none; animation: unseen-label 1.5s ease-in-out infinite; }
    #world.far .question-card.unseen::after { top: -2.1em; }
    @keyframes unseen-pulse {
      0%, 100% { box-shadow: var(--shadow), 0 0 0 0 transparent, 0 0 0 0 transparent; }
      50% { box-shadow: var(--shadow), 0 0 0 max(5px, calc(4px / var(--z, 1))) color-mix(in srgb, var(--accent) 80%, transparent), 0 0 max(28px, calc(20px / var(--z, 1))) max(10px, calc(8px / var(--z, 1))) color-mix(in srgb, var(--accent) 45%, transparent); }
    }
    @keyframes unseen-header { 50% { background: color-mix(in srgb, var(--accent) 76%, var(--on-accent)); } }
    @keyframes unseen-fill { 50% { background: var(--accent-tint); } }
    @keyframes unseen-label { 50% { transform: scale(1.12); } }
    @media (prefers-reduced-motion: reduce) {
      .question-card.unseen, .question-card.unseen.highlight, #world.far .question-card.unseen { animation: none; box-shadow: var(--shadow), 0 0 0 max(5px, calc(4px / var(--z, 1))) color-mix(in srgb, var(--accent) 80%, transparent); }
      .question-card.unseen .question-header, .question-card.unseen::after { animation: none; }
    }
    .card-top { display: flex; align-items: flex-start; gap: 6px; }
    .badges { display: flex; flex-wrap: wrap; gap: 5px; }
    .badge { display: inline-block; padding: 2px 7px; border-radius: var(--radius-small); font-size: 11px; line-height: 1.5; color: var(--muted); background: var(--panel); }
    .badge.settled, .badge.done { color: var(--green); background: var(--green-tint); }
    .badge.asking { color: var(--accent); background: var(--accent-tint); }
    .badge.researching { color: var(--amber); background: var(--amber-tint); }
    .question-id { flex-shrink: 0; padding: 1px 5px; border: 1px solid var(--border); border-radius: var(--radius-small); font-size: 11px; color: inherit; }
    /* Question headers reserve their own strip above the decision and details. */
    .question-card, .question-card.compact { padding: 0; }
    .question-header { padding: 10px 12px; border-radius: calc(var(--radius) - 1px) calc(var(--radius) - 1px) 0 0; border-bottom: 1px solid var(--border); color: var(--text); }
    .question-card.settled .question-header,
    .question-card.researching .question-header { background: var(--text); color: var(--card); }
    .question-card.asking .question-header { background: var(--accent); color: var(--on-accent); }
    .question-header .badges { align-items: center; min-width: 0; }
    .question-header .details-toggle { flex-shrink: 0; color: inherit; }
    .question-card.settled .question-header .badge,
    .question-card.researching .question-header .badge,
    .question-card.asking .question-header .badge { background: transparent; color: inherit; }
    .question-card.settled .question-id,
    .question-card.researching .question-id,
    .question-card.asking .question-id { border-color: currentColor; }
    .question-title { font-size: 14px; font-weight: 700; margin: 6px 0 0; line-height: 1.4; }
    .question-card.compact .question-title, .question-card.researching .question-title,
    .question-card.waiting .question-title { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .question-card.asking .question-title { font-size: 15px; font-weight: 700; }
    .question-body { padding: 12px 14px; }
    .question-card.compact .question-body { padding: 10px 12px; }
    .decision-title { font: 700 15px/1.4 var(--font-display); margin: 0; }
    .question-card.compact .decision-title { font-size: 14px; font-weight: 600; padding-right: 16px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    .body, .note, .answer-text { margin: 8px 0 0; font-size: 13px; white-space: pre-wrap; }
    .body, .note { color: var(--muted); }
    .options { list-style: none; margin: 10px 0 0; padding: 0; display: grid; gap: 5px; }
    .option { display: flex; align-items: flex-start; gap: 7px; padding: 6px 8px; border: 1px solid var(--border); border-radius: var(--radius-small); font-size: 13px; }
    .option-label { flex: 1; min-width: 0; white-space: pre-wrap; }
    .recommended-tag { font-size: 10px; color: var(--accent); text-align: right; }
    .option.dimmed { color: var(--muted); }
    .option.chosen, .answer-text.chosen { color: var(--green); background: var(--green-tint); border-color: var(--green); }
    .answer-text.chosen { border-radius: var(--radius-small); padding: 6px 8px; }
    .check { color: var(--green); }
    .question-card.highlight { animation: card-highlight 1.2s ease-out; }
    @keyframes card-highlight { from { outline: 3px solid var(--accent); background: var(--highlight); } to { outline: 3px solid transparent; background: var(--card); } }
    @keyframes live-pulse { 0%, 100% { transform: scale(1); } 35% { transform: scale(1.8); } }

    /* Spec panel and smaller screens. */
    .spec-panel { position: sticky; top: 16px; min-width: 0; max-height: calc(100vh - 32px); overflow-y: auto; background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; }
    .spec-panel h2 { margin: 0; font-size: 18px; }
    .spec-hint { margin: 4px 0 20px; color: var(--muted); font-size: 13px; }
    .spec-section { margin-top: 20px; }
    .spec-section h3 { margin: 0 0 8px; font-size: 14px; }
    .spec-section ol, .spec-section ul { margin: 0; padding-left: 22px; }
    .spec-section li { margin: 0 0 8px; white-space: pre-wrap; }
    .spec-section li .badge { margin-left: 7px; white-space: normal; }
    .empty { margin: 0; color: var(--muted); font-size: 13px; }
    .copy-button { margin-top: 20px; border: 1px solid var(--border); background: var(--card); color: var(--text); padding: 8px 12px; border-radius: var(--radius-small); font: inherit; cursor: pointer; }
    .copy-button:hover { border-color: var(--accent); }
    .copy-button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
    .copy-buffer { position: fixed; left: -10000px; top: 0; width: 1px; height: 1px; opacity: 0; }

    /* Infinite world and floating controls override the former page layout. */
    html, body { height: 100%; overflow: hidden; }
    button, textarea { font: inherit; color: var(--text); }
    button { cursor: pointer; }
    button:focus-visible, a:focus-visible, .node:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
    #canvas { position: fixed; inset: 0; touch-action: none; user-select: none; overflow: hidden; cursor: grab; }
    #canvas.dragging { cursor: grabbing; }
    #world { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
    #grid { position: absolute; inset: 0; pointer-events: none; background-image: radial-gradient(circle, var(--border) var(--dot-radius, 1px), transparent var(--dot-radius, 1px)); opacity: .25; }
    .connectors { width: 1px; height: 1px; overflow: visible; }
    .node { position: absolute; margin: 0; cursor: grab; }
    .question-card { width: 300px; max-width: none; }
    .question-card.picture-options { width: 460px; }
    .question-card.selected { outline: 2px solid var(--accent); outline-offset: 2px; }
    .question-card.drop-target, .idea-card.drop-target { box-shadow: 0 0 0 4px var(--accent-tint); border-color: var(--accent); }
    .tiles { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 8px; }
    .tiles .option { display: flex; flex-wrap: wrap; padding: 0 0 7px; overflow: hidden; gap: 5px; }
    .tiles .option-label { flex-basis: 75%; padding: 0 7px; }
    .tiles .recommended-tag { padding: 0 7px; text-align: left; }
    .tiles .ref-note, .tiles .note-editor { width: 100%; margin: 0 7px; }
    .tiles .check { padding-left: 7px; }
    .tile-picture { position: relative; overflow: hidden; width: 100%; aspect-ratio: 16 / 10; background: var(--panel); border: 0; padding: 0; display: block; cursor: zoom-in; }
    .tile-picture img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
    .empty-picture { cursor: inherit; }
    .board-caption { position: absolute; margin: 0; white-space: nowrap; pointer-events: none; }
    .floating { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); }
    .header { position: fixed; top: 16px; left: 16px; width: min(420px, calc(100vw - 408px)); margin: 0; padding: 14px 16px; display: block; z-index: 3; pointer-events: none; }
    h1 { font-size: 21px; }
    .idea-text { margin-top: 6px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .progress { justify-content: flex-start; padding-top: 8px; font-size: 12px; }
    .spec-panel { position: fixed; top: 16px; right: 16px; bottom: 16px; width: 360px; max-height: none; padding: 0; overflow: hidden; background: var(--card); z-index: 4; }
    #spec-content { height: 100%; overflow: auto; padding: 48px 18px 18px; user-select: text; }
    #spec-toggle { position: absolute; right: 10px; top: 10px; border: 1px solid var(--border); background: var(--card); border-radius: var(--radius-small); padding: 4px 10px; z-index: 1; }
    .spec-panel.collapsed { width: auto; height: auto; bottom: auto; min-width: 50px; }
    .spec-panel.collapsed #spec-toggle { position: static; margin: 8px; }
    .spec-panel { display: flex; flex-direction: column; }
    #spec-content { min-height: 0; flex: 1; }
    /* Canvas sketches keep their live preview mounted while the tree changes. */
    .sketch-card { background: transparent; border: 1px solid transparent; border-radius: var(--radius); box-shadow: none; padding: 10px; z-index: 1; }
    /* The label row reserves room for a counter-scaled title without remeasuring. */
    .sketch-card-header { position: relative; display: flex; align-items: flex-end; gap: 8px; height: 45px; margin-bottom: 10px; font-size: 12px; white-space: nowrap; }
    .sketch-card-header .caption { flex-shrink: 0; }
    .sketch-viewport { flex-shrink: 0; color: var(--muted); font-size: 11px; }
    .sketch-card-header strong { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 15px; }
    .sketch-card iframe, .sketch-card img { pointer-events: none; }
    .sketch-card-note { color: var(--muted); font-size: 12px; margin: 10px 0 0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .sketch-frame { position: relative; flex: none; overflow: hidden; background: var(--panel); border: 1px solid var(--border); border-radius: 6px; box-shadow: var(--sketch-shadow); }
    .sketch-surface { position: absolute; left: 0; top: 0; border: 0; transform-origin: 0 0; max-width: none; max-height: none; }
    .panel-resize { position: absolute; left: 0; top: 0; bottom: 0; width: 6px; cursor: ew-resize; touch-action: none; z-index: 6; }
    .spec-panel.collapsed #spec-content, .spec-panel.collapsed .panel-resize { display: none; }
    .lightbox.sketch-overlay { padding: 4vh 4vw; }
    .sketch-overlay-heading { display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 12px; }
    .sketch-overlay-heading a { color: white; font-size: 12px; }
    .sketch-overlay h2 { margin: 0; font-size: 18px; }
    .sketch-overlay .sketch-surface { max-width: none; max-height: none; }
    .sketch-overlay iframe { pointer-events: auto; }
    /* Live research and report reading use the existing research colour family. */
    .research-chip-group { min-width: 0; max-width: 220px; }
    .research-steps { margin-top: 6px; color: var(--muted); font-size: 12px; }
    .research-step { margin: 3px 0; }
    .research-steps.latest .research-step { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .step-dot { display: inline-block; width: 6px; height: 6px; margin-right: 6px; border-radius: 50%; background: var(--amber); animation: research-pulse 1.4s ease-in-out infinite; }
    @keyframes research-pulse { 50% { opacity: .3; } }
    @media (prefers-reduced-motion: reduce) { .step-dot { animation: none; } }
    .report-card { width: 240px; padding: 12px; background: var(--card); border: 1px solid var(--border); border-left: 3px solid var(--violet); border-radius: var(--radius); box-shadow: var(--shadow); }
    .report-card h3 { margin: 8px 0; font-size: 13px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    .report-card .report-finding { color: var(--muted); font-size: 12px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; white-space: pre-wrap; }
    .report-card footer { color: var(--muted); font-size: 12px; margin-top: 8px; }
    .report-card.stacked { padding: 8px 10px; background: var(--violet-tint); border: 0; border-left: 3px solid var(--violet); box-shadow: none; }
    .report-card.stacked .report-meta { display: block; margin-bottom: 4px; font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .report-card.stacked h3 { display: block; margin: 0; font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .read-report { color: var(--violet); background: transparent; border: 1px solid var(--border); border-radius: var(--radius-small); padding: 4px 8px; margin-top: 8px; }
    .reader-column { width: min(760px, 100%); max-height: 88vh; overflow: auto; padding: 24px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--card); color: var(--text); font-size: 15px; line-height: 1.65; user-select: text; }
    .reader-column h1, .reader-column h2, .reader-column h3, .reader-column h4 { margin: 20px 0 10px; line-height: 1.3; }
    .reader-column header h2 { margin-top: 6px; }
    .reader-column a { color: var(--accent); }
    .lightbox .reader-column p { margin: 10px 0; white-space: pre-wrap; text-align: left; max-height: none; }
    .reader-column ul, .reader-column ol { padding-left: 24px; }
    .reader-column pre { padding: 12px; background: var(--panel); overflow-x: auto; border-radius: var(--radius-small); }
    .reader-column code { background: var(--panel); font-size: 13px; }
    .reader-column blockquote { margin: 12px 0; padding-left: 14px; border-left: 3px solid var(--violet); color: var(--muted); }
    .reader-column .table-scroll { overflow-x: auto; }
    .reader-column table { border-collapse: collapse; width: 100%; }
    .reader-column th, .reader-column td { border: 1px solid var(--border); padding: 6px 10px; text-align: left; }
    .reader-column hr { border: 0; border-top: 1px solid var(--border); }
    /* Resize strips affect hit testing only; grips reserve no layout space. */
    .node-resize { position: absolute; border: 0; padding: 0; background: transparent; color: var(--muted); touch-action: none; z-index: 4; }
    /* Grab areas keep their size on screen when the board is zoomed out. */
    .resize-edge { --strip: min(calc(8px / var(--z, 1)), 24px); }
    .resize-w, .resize-e { top: 8px; bottom: 8px; width: var(--strip); cursor: ew-resize; }
    .resize-w { left: calc(var(--strip) / -2); }
    .resize-e { right: calc(var(--strip) / -2); }
    .resize-n, .resize-s { left: 8px; right: 8px; height: var(--strip); cursor: ns-resize; }
    .resize-n { top: calc(var(--strip) / -2); }
    .resize-s { bottom: calc(var(--strip) / -2); }
    .resize-corner { --grip: min(calc(16px / var(--z, 1)), 40px); width: var(--grip); height: var(--grip); opacity: 0; }
    .resize-nw, .resize-ne { top: 0; }
    .resize-sw, .resize-se { bottom: 0; }
    .resize-nw, .resize-sw { left: 0; }
    .resize-ne, .resize-se { right: 0; }
    .resize-nw, .resize-se { cursor: nwse-resize; }
    .resize-ne, .resize-sw { cursor: nesw-resize; }
    .resize-corner::after { content: ''; position: absolute; inset: 30%; border-right: 2px solid currentColor; border-bottom: 2px solid currentColor; }
    .resize-nw::after { transform: rotate(180deg); }
    .resize-ne::after { transform: rotate(270deg); }
    .resize-sw::after { transform: rotate(90deg); }
    .node:hover > .resize-corner, .node:focus-within > .resize-corner { opacity: 1; }
    @media (pointer: coarse) { .resize-edge { --strip: min(calc(16px / var(--z, 1)), 48px); } .resize-se { opacity: .4; } }
    .toolbar { position: fixed; bottom: 16px; left: 16px; display: flex; align-items: center; gap: 4px; padding: 6px; z-index: 5; }
    .toolbar button, .icon-button { border: 0; background: transparent; padding: 6px 9px; border-radius: var(--radius-small); }
    .toolbar button:hover, .icon-button:hover { background: var(--panel); }
    #zoom-percent { min-width: 45px; text-align: center; font-size: 12px; }
    .warning, .waiting-message, .toast, .drop-hint { position: fixed; left: 50%; transform: translateX(-50%); bottom: 76px; z-index: 8; padding: 10px 16px; max-width: min(600px, calc(100vw - 32px)); min-height: 0; text-align: center; white-space: pre-wrap; pointer-events: none; }
    .warning { bottom: 126px; border: 1px solid var(--amber); border-radius: var(--radius); }
    .drop-hint { bottom: 180px; color: var(--accent); }
    .reference-card { width: 200px; padding: 8px; background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); z-index: 1; }
    #reference-add-errors { position: fixed; right: 16px; bottom: 76px; z-index: 8; display: grid; gap: 8px; max-width: min(360px, calc(100vw - 32px)); max-height: 50vh; overflow: auto; }
    .reference-add-error { padding: 10px 12px; }
    .reference-add-error p { margin: 0 0 8px; overflow-wrap: anywhere; }
    .reference-add-error button + button { margin-left: 8px; }
    /* Research notes have their own status colours and retain finding line breaks. */

    .details-toggle { margin-left: auto; border: 0; background: transparent; color: var(--muted); padding: 0 5px; }

    .yours { position: absolute; top: 4px; right: 4px; z-index: 2; }

    .reference-card:hover .delete-ref, .reference-card:focus-within .delete-ref, .option:hover .delete-ref, .option:focus-within .delete-ref { opacity: 1; }

    .lightbox img { max-width: 90vw; max-height: 80vh; object-fit: contain; }

    .node.highlight { animation: card-highlight 1.2s ease-out; }

<body>

  <!-- Pure logic lives in the blocks below: no document, no window, no state shared with the page.
       Each block defines one global. Tests load a block by its id: `node --test tests/board/*.test.mjs`. -->
  <script id="grill-session">
    // model(rawSession, rawUser, options = {}) -> normalized lang, title, idea, answered, status, labels, refs, sketches, architecture, research, questions;
    // plus ideaNodeId, userRefs, boardRefs, boardSketches, boardReports, optionPictures, questionsByStatus, questionsById, openQuestions, researchByStatus, boardResearch, unfinishedResearch, pendingCount.
    // Sketches hold nodeId; research notes hold nodeId and reportNodeId; boardSketches and boardReports are the sketches and done reports with a usable source.
    // Questions hold pending (boolean), pendingItem (batch item or null), validDependencies (ids), research (notes), optionPictures (option id -> reference); refs hold nodeId; refs/research keep raw target and parsedTarget.
    // boardRefs are usable standalone refs with anchorId (question/idea node id or ''); optionPictures lists the first usable picture per exact option target, agent refs before user refs, excluding waiting questions; boardResearch holds notes without a known question.
    // Groups preserve file order; lookups are objects; options.serverMode: false disables pending; options.baseUrl resolves reference sources (default https://grillboard.invalid/).
    // options.imageSources is a set of reference sources successfully decoded as images by the page.
    // parseTarget(target) -> { questionId, optionId }, each '' when absent; 'idea' remains questionId 'idea'.
    // hasAnswer(answer) -> true when an option is chosen or text is not blank.
    // ANSWER_TEXT_MAX -> 2000, the maximum answer text length.
    // questionNumber(id) -> digit string for q<number> (case insensitive, preserving zeros), otherwise ''.
    // nodeId(kind, id) -> board id for idea, question, ref:user, ref:agent, research, report or sketch; unknown kinds throw.
    // parseNodeId(nodeId) -> { kind, id }, reversing nodeId; unprefixed ids are questions and @idea is the idea with id ''.
    // object(value) -> non-array object, otherwise {}; shared by page state readers.
    // string(value) -> string for strings/numbers/booleans, otherwise ''; shared by page text readers.
    // array(value) -> array with omitted entries skipped, otherwise []; shared by page state readers.
    // singleWebUrl(value) -> trimmed complete HTTP(S) URL, otherwise ''; shared by research, Markdown and pasted links.
    // safeSource(value, baseUrl) -> trimmed relative or HTTP(S) destination, otherwise ''; default baseUrl is https://grillboard.invalid/.
    // isPicture(ref) -> true for image kind or PNG/JPEG/GIF/WebP/SVG extension (ignoring query/fragment).
    const GrillSession = (() => {
      // Normalize optional and malformed fields at the boundary.
      function object(value) { return value && typeof value === 'object' && !Array.isArray(value) ? value : {}; }
      function string(value) { return typeof value === 'string' ? value : typeof value === 'number' || typeof value === 'boolean' ? String(value) : ''; }
      function array(value) { return Array.isArray(value) ? value.filter(() => true) : []; }
      function questionStatus(value) { return ['settled', 'asking', 'researching', 'waiting'].includes(value) ? value : 'waiting'; }
      function normalizeSession(value) {
        const source = object(value);
        return {
          lang: string(source.lang), title: string(source.title), idea: string(source.idea),
          answered: string(source.answered), status: string(source.status), labels: object(source.labels), refs: normalizeRefs(source.refs, false),
          sketches: normalizeSketches(source.sketches),
          architecture: Array.from(array(source.architecture), string), research: normalizeResearch(source.research),
          questions: Array.from(array(source.questions), value => {
            const q = object(value);
            const answer = object(q.answer);
            const round = typeof q.round === 'number' ? q.round : typeof q.round === 'string' && q.round.trim() ? Number(q.round) : NaN;
            return {
              id: string(q.id), round: Number.isFinite(round) ? round : '',
              title: string(q.title), body: string(q.body), status: questionStatus(q.status),
              reopened: q.reopened === true, dependsOn: Array.from(array(q.dependsOn), string),
              options: Array.from(array(q.options), value => {
                const option = object(value);
                return { id: string(option.id), label: string(option.label), sketch: string(option.sketch),
                  width: sketchDimension(option.width, 390), height: sketchDimension(option.height, 760) };
              }),
              recommended: q.recommended == null ? null : string(q.recommended),
              recommendation: string(q.recommendation), decision: string(q.decision),
              answer: { option: answer.option == null ? null : string(answer.option), text: string(answer.text) }
            };
          })
        };
      }
      // Sketch geometry has bounded defaults; destinations are checked before rendering.
      function sketchDimension(value, fallback) { return Math.max(200, Math.min(4000, typeof value === 'number' && Number.isFinite(value) ? value : fallback)); }
      function normalizeSketches(value) {
        return array(value).map(value => {
          const sketch = object(value);
          return { id: string(sketch.id), nodeId: nodeId('sketch', string(sketch.id)), title: string(sketch.title), src: string(sketch.src),
            rev: typeof sketch.rev === 'number' && Number.isFinite(sketch.rev) ? sketch.rev : 0,
            width: sketchDimension(sketch.width, 1280), height: sketchDimension(sketch.height, 800), note: string(sketch.note) };
        });
      }
      // Research sources accept only complete HTTP(S) URLs, never relative destinations.
      function normalizeResearch(value) {
        return array(value).map(value => {
          const note = object(value);
          return { id: string(note.id), nodeId: nodeId('research', string(note.id)), reportNodeId: nodeId('report', string(note.id)),
            target: string(note.target), parsedTarget: parseTarget(note.target), topic: string(note.topic),
            status: ['todo', 'running', 'done'].includes(note.status) ? note.status : 'todo', finding: string(note.finding), report: string(note.report),
            sources: array(note.sources).map(value => {
              const source = object(value);
              return { title: string(source.title), url: singleWebUrl(source.url) };
            }).filter(source => source.url) };
        });
      }
      function normalizeRefs(value, user) {
        return array(value).map(value => {
          const ref = object(value);
          return { id: string(ref.id), nodeId: nodeId(user ? 'ref:user' : 'ref:agent', ref.id), src: string(ref.src), target: string(ref.target), parsedTarget: parseTarget(ref.target), caption: string(ref.caption),
            note: string(ref.note), name: string(ref.name), kind: string(ref.kind), user: user === true };
        });
      }
      function singleWebUrl(text) {
        const value = string(text).trim();
        if (!/^https?:\/\/\S+$/i.test(value)) return '';
        try { const url = new URL(value); return /^https?:$/.test(url.protocol) ? value : ''; } catch (_) { return ''; }
      }
      function safeSource(value, baseUrl = 'https://grillboard.invalid/') {
        const src = string(value).trim();
        if (!src || /[\\\u0000-\u001f\u007f]/.test(src) || src.startsWith('//')) return '';
        if (/^[a-z][a-z0-9+.-]*:/i.test(src) && !/^https?:/i.test(src)) return '';
        try { const url = new URL(src, baseUrl); return /^https?:/i.test(src) ? (/^https?:$/.test(url.protocol) ? src : '') : src; }
        catch (_) { return ''; }
      }
      function isPicture(ref) { return ref.kind === 'image' || /\.(png|jpe?g|gif|webp|svg)$/i.test(ref.src.split(/[?#]/)[0]); }
      function parseTarget(target) {
        const parts = string(target).split(':');
        return { questionId: parts[0] || '', optionId: parts[1] || '' };
      }
      function batchNumber(id) { const match = /^a([1-9][0-9]*)$/.exec(id || ''); return match ? Number(match[1]) : 0; }
      function hasAnswer(answer) { return !!answer && (answer.option != null || !!string(answer.text).trim()); }
      const ANSWER_TEXT_MAX = 2000;
      function questionNumber(id) { const match = /^q([0-9]+)$/i.exec(string(id)); return match ? match[1] : ''; }
      const nodePrefixes = { 'ref:user': 'ref:user:', 'ref:agent': 'ref:agent:', research: 'research:', report: 'report:', sketch: 'sketch:' };
      function nodeId(kind, id) {
        if (kind === 'idea') return '@idea';
        if (kind === 'question') return string(id);
        if (!Object.prototype.hasOwnProperty.call(nodePrefixes, kind)) throw new Error('Unknown board node kind: ' + kind);
        return nodePrefixes[kind] + string(id);
      }
      function parseNodeId(value) {
        const id = string(value);
        if (id === '@idea') return { kind: 'idea', id: '' };
        for (const [kind, prefix] of Object.entries(nodePrefixes)) if (id.startsWith(prefix)) return { kind, id: id.slice(prefix.length) };
        return { kind: 'question', id };
      }
      function model(rawSession, rawUser, options = {}) {
        const data = normalizeSession(rawSession);
        const user = object(rawUser);
        const questionsByStatus = { settled: [], asking: [], researching: [], waiting: [] };
        const questionsById = Object.fromEntries(data.questions.map(q => [q.id, q]));
        const researchByStatus = { todo: [], running: [], done: [] };
        const userRefs = normalizeRefs(user.refs, true);
        const boardResearch = [], boardRefs = [], optionPictures = [];
        for (const q of data.questions) {
          q.validDependencies = [...new Set(q.dependsOn)].filter(id => id !== q.id && Object.prototype.hasOwnProperty.call(questionsById, id));
          q.research = []; q.optionPictures = {};
        }
        for (const q of data.questions) { q.research = questionsById[q.id].research; q.optionPictures = questionsById[q.id].optionPictures; }
        for (const q of data.questions) questionsByStatus[q.status].push(q);
        for (const note of data.research) {
          researchByStatus[note.status].push(note);
          if (Object.prototype.hasOwnProperty.call(questionsById, note.parsedTarget.questionId)) questionsById[note.parsedTarget.questionId].research.push(note);
          else boardResearch.push(note);
        }
        for (const ref of data.refs.concat(userRefs)) {
          const src = safeSource(ref.src, options.baseUrl);
          if (!src) continue;
          const usable = { ...ref, src };
          if (!ref.kind && options.imageSources && options.imageSources.has(src)) usable.kind = 'image';
          const q = Object.prototype.hasOwnProperty.call(questionsById, ref.parsedTarget.questionId) ? questionsById[ref.parsedTarget.questionId] : null;
          const optionTarget = q && q.options.some(option => ref.parsedTarget.optionId === option.id && ref.target === q.id + ':' + option.id);
          if (optionTarget && q.status !== 'waiting' && isPicture(usable) && !Object.prototype.hasOwnProperty.call(q.optionPictures, ref.parsedTarget.optionId)) {
            Object.defineProperty(q.optionPictures, ref.parsedTarget.optionId, { value: usable, enumerable: true });
            optionPictures.push(usable);
          } else {
            const target = optionTarget ? q.id : ref.target;
            const anchorId = target === 'idea' || target === nodeId('idea') ? nodeId('idea') : Object.prototype.hasOwnProperty.call(questionsById, target) ? target : '';
            boardRefs.push({ ...usable, anchorId });
          }
        }
        const asking = new Set(questionsByStatus.asking.map(q => q.id));
        const pending = new Map();
        if (options.serverMode !== false) {
          const batches = array(user.answers).map(object).filter(batch => batchNumber(batch.id) > batchNumber(data.answered))
            .sort((a, b) => batchNumber(a.id) - batchNumber(b.id));
          for (const batch of batches) for (const item of array(batch.items).map(object)) if (asking.has(item.question)) pending.set(item.question, item);
        }
        for (const q of data.questions) { q.pending = q.status === 'asking' && pending.has(q.id); q.pendingItem = q.pending ? pending.get(q.id) : null; }
        return { ...data, ideaNodeId: nodeId('idea'), userRefs, boardRefs, optionPictures, questionsByStatus, questionsById,
          boardSketches: data.sketches.filter(sketch => safeSource(sketch.src, options.baseUrl)),
          boardReports: researchByStatus.done.filter(note => safeSource(note.report, options.baseUrl)),
          openQuestions: data.questions.filter(q => q.status !== 'settled'), researchByStatus, boardResearch,
          unfinishedResearch: data.research.filter(note => note.status !== 'done'), pendingCount: pending.size };
      }
      return { model, parseTarget, hasAnswer, ANSWER_TEXT_MAX, questionNumber, nodeId, parseNodeId, object, string, array, singleWebUrl, safeSource, isPicture };
    })();
  </script>
  <!-- The camera block is separate from the session block: it knows rectangles, not questions. -->
  <script id="grill-camera">
    // fit(boxes, screen) -> { x, y, z }, fitting nonempty board rectangles at zoom .1 to 1.
    // focus(boxes, screen, { minimum }) -> { x, y, z }, keeping a fitting prefix at minimum .7 or .4.
    // isFar(z) -> boolean, whether the view uses the far presentation.
    // boxes: { x, y, width, height }[]; screen: { width, height, boardHidden,
    // header: { right, bottom }, toolbar: { right, top }, roundBar: { top } | null,
    // specPanel: { left, top } | null }; null means hidden round bar or collapsed spec panel.
    const GrillCamera = (() => {
      function visibleArea(screen, full, aboveToolbar) {
        const narrow = screen.width < 900;
        const y = screen.boardHidden || (full && !narrow) ? 0 : screen.header.bottom + 8;

  <script id="grill-changes">
    // between(previous, current, context = {}) -> { highlights: { [nodeId]: reason[] }, collapsedQuestions: questionId[], newQuestions: questionId[], changedResearch: noteId[], viewTarget: { kind: 'sketches' | 'report' | 'questions', nodeIds: nodeId[] } | null }.
    // previous and current are GrillSession models; previous is null on the first render, which highlights nothing and never moves the view.
    // newQuestions are the questions that are asking now and were not asking before; the page marks them until the user touches them.
    // reasons: question-status, research-status, sketch-added, sketch-revised, report-added, reference-added. A new reference on an option highlights its question.

          }

    // Clipboard API with a disk-compatible textarea fallback.

      glideView(GrillCamera.focus(boxes, measureScreen(), { minimum: only ? .4 : .7 }), animate);
    }
    function glideView(end, animate) {
      cancelGlide();

      const start = { ...view }; let started = null;

    }
    // Switching reuses the mounted nodes and preserves readers, overlays, and selection.
    function toggleFlow() {

      flow = flow === 'td' ? 'lr' : 'td';
      try { localStorage.setItem(flowKey, flow); } catch (_) { /* The setting is optional when storage is unavailable. */ }
      document.documentElement.dataset.flow = flow;
      manualOffsets = readOffsets(); measureAndLayout(); updateFlowButton(); fitToScreen(true);
    }
    function updateFlowButton() {
      const control = toolbar.querySelector('.flow-toggle'), label = currentLabels[flow === 'td' ? 'flowTd' : 'flowLr'];
      control.textContent = flow === 'td' ? '↓' : '→'; control.title = label; control.setAttribute('aria-label', label);
    }
    function renderToolbar() {
      if (toolbar.children.length) {
        const labels = [currentLabels.zoomOut, currentLabels.zoomIn, currentLabels.fit, currentLabels.focusRound, '', currentLabels.resetLayout];
        toolbar.setAttribute('aria-label', currentLabels.toolbar);
        toolbar.querySelectorAll('button').forEach((control, index) => {
          control.title = labels[index]; control.setAttribute('aria-label', labels[index]);
        });
        updateFlowButton(); applyView(); return;
      }
      const percent = element('span'); percent.id = 'zoom-percent'; percent.setAttribute('aria-live', 'off');
      toolbar.setAttribute('aria-label', currentLabels.toolbar);
      toolbar.replaceChildren(
        button('−', currentLabels.zoomOut, () => zoomCenter(1 / 1.2)), percent,
        button('+', currentLabels.zoomIn, () => zoomCenter(1.2)),
        button('⊡', currentLabels.fit, fitToScreen),
        button('◎', currentLabels.focusRound, () => { recordInteraction(); focusView(false); }),
        button('', '', toggleFlow, 'flow-toggle'),
        button('↺', currentLabels.resetLayout, () => { manualOffsets = Object.create(null); nodeSizes = Object.create(null); saveOffsets(); saveNodeSizes();
          for (const record of nodeRecords.values()) applyNodeSize(record);
          measureAndLayout(); fitToScreen(); })
      );
      updateFlowButton();
      applyView();
    }
    function updateFloatingControls() {
      const bottom = window.innerWidth < 900 && !specCollapsed ? window.innerHeight - specPanel.getBoundingClientRect().top + 8 : 16;
      toolbar.style.bottom = bottom + 'px';
      if (window.innerWidth < 900) {
        roundBar.style.left = '50%'; roundBar.style.bottom = (bottom + toolbar.getBoundingClientRect().height + 8) + 'px';
      } else {
        const right = specCollapsed ? window.innerWidth : specPanel.getBoundingClientRect().left;
        const toolbarBox = toolbar.getBoundingClientRect();
        const besideToolbar = right - toolbarBox.right - 28 >= 200;
        const left = besideToolbar ? toolbarBox.right + 12 : 16;
        roundBar.style.left = ((left + right) / 2) + 'px';
        roundBar.style.bottom = (besideToolbar ? 16 : window.innerHeight - toolbarBox.top + 8) + 'px';
        roundBar.style.maxWidth = Math.max(200, right - left - 16) + 'px';
      }
      if (window.innerWidth < 900) roundBar.style.maxWidth = '';
    }
    function updateSpec() {
      specPanel.classList.toggle('collapsed', specCollapsed);
      specToggle.textContent = specCollapsed ? currentLabels.spec : '×';
      applyPanelWidth();
      specToggle.setAttribute('aria-label', currentLabels.toggleSpec);
      specToggle.setAttribute('aria-expanded', String(!specCollapsed));
      specToggle.title = currentLabels.toggleSpec;
      updateFloatingControls();
    }
    specToggle.addEventListener('click', () => { specCollapsed = !specCollapsed; updateSpec(); });
    let wasNarrow = window.innerWidth < 900;
    window.addEventListener('resize', () => {
      const narrow = window.innerWidth < 900;
      if (narrow && !wasNarrow) { specCollapsed = true; updateSpec(); }
      wasNarrow = narrow; updateSpec(); scaleEnlargedSketch(); applyView();
    });

    // Pointer capture handles pans, node drags, and two-finger touch pinches.
    const pointers = new Map();
    let gesture = null;
    let pinch = null;
    let suppressClickUntil = 0;
    function touchPair() { return [...pointers.values()].filter(pointer => pointer.type === 'touch').slice(0, 2); }
    function beginPinch() {
      const pair = touchPair(); if (pair.length !== 2) return;
      if (gesture && gesture.dragged && gesture.record) {
        if (gesture.inlineRef) discardInlineDrag(gesture);
        else saveOffsets();
      }
      const x = (pair[0].x + pair[1].x) / 2, y = (pair[0].y + pair[1].y) / 2;
      pinch = { distance: Math.max(1, Math.hypot(pair[0].x - pair[1].x, pair[0].y - pair[1].y)), zoom: view.z, point: worldPoint(x, y) };
      gesture = null; suppressClickUntil = Date.now() + 500; clearDropTarget();
    }
    function discardInlineDrag(ended) {
      ended.record.element.remove(); nodeRecords.delete(ended.record.id);
      delete manualOffsets[ended.record.id]; saveOffsets(); applyOffsets(); scheduleLines();
    }
    function refByNodeId(id) { return currentUserRefs.find(ref => ref.nodeId === id); }
    canvas.addEventListener('pointerdown', () => { suppressClickUntil = 0; }, true);
    canvas.addEventListener('pointerdown', event => {
      if (nodeResize) { event.preventDefault(); return; }
      if (event.button !== 0) return;
      if (event.target.closest('.connector-handle')) {
        const node = event.target.closest('.node'); const record = node && nodeRecords.get(node.dataset.nodeId);
        if (!canWrite || !record || !record.ref || !record.ref.user) return;
        event.preventDefault(); cancelGlide(); recordInteraction(); canvas.setPointerCapture(event.pointerId);
        connection = { pointerId: event.pointerId, record, point: worldPoint(event.clientX, event.clientY), startX: event.clientX, startY: event.clientY, moved: false };
        scheduleLines(); return;
      }
      if (event.target.closest('textarea, input, a, .delete-ref, .ref-note, .disconnect-ref, .details-toggle, .research-chip, .node-resize, .variant-open, .accept-recommendation')) return;
      cancelGlide(); event.preventDefault();
      pointers.set(event.pointerId, { x: event.clientX, y: event.clientY, type: event.pointerType });
      canvas.setPointerCapture(event.pointerId);
      if (touchPair().length >= 2) { recordInteraction(); beginPinch(); return; }
      const node = event.target.closest('.node');
      const inline = event.target.closest('[data-inline-ref]');
      const inlineRef = inline && inline.classList.contains('tile-picture') && canWrite && refByNodeId(inline.dataset.inlineRef);
      const record = node && nodeRecords.get(node.dataset.nodeId);
      gesture = { pointerId: event.pointerId, startX: event.clientX, startY: event.clientY, x: view.x, y: view.y,
        record, offsetX: record && manualOffsets[record.id] ? manualOffsets[record.id].dx : 0,
        offsetY: record && manualOffsets[record.id] ? manualOffsets[record.id].dy : 0, dragged: false, inlineRef,
        answerControl: event.target.closest('[data-answer-option]'), question: node && node.dataset.questionId, picture: event.target.closest('[data-picture]') };
      if (record) record.element.focus({ preventScroll: true });
    });
    canvas.addEventListener('pointermove', event => {
      if (connection && connection.pointerId === event.pointerId) {
        connection.point = worldPoint(event.clientX, event.clientY);
        if (Math.hypot(event.clientX - connection.startX, event.clientY - connection.startY) > 6) connection.moved = true;
        setDropTarget(connectionTargetAt(event.clientX, event.clientY)); scheduleLines(); return;
      }
      if (!pointers.has(event.pointerId)) return;
      pointers.set(event.pointerId, { x: event.clientX, y: event.clientY, type: event.pointerType });
      if (pinch) {
        recordInteraction();
        const pair = touchPair(); if (pair.length < 2) return;
        const x = (pair[0].x + pair[1].x) / 2, y = (pair[0].y + pair[1].y) / 2;
        view.z = Math.max(.1, Math.min(2, pinch.zoom * Math.hypot(pair[0].x - pair[1].x, pair[0].y - pair[1].y) / pinch.distance));
        view.x = x - pinch.point.x * view.z; view.y = y - pinch.point.y * view.z; applyView(); return;
      }
      if (!gesture || gesture.pointerId !== event.pointerId) return;
      const dx = event.clientX - gesture.startX, dy = event.clientY - gesture.startY;
      if (!gesture.dragged && Math.hypot(dx, dy) < 4) return;
      if (!gesture.dragged && gesture.inlineRef) {
        // An option picture becomes a temporary reference card while it is dragged.
        const ref = gesture.inlineRef, point = worldPoint(gesture.startX, gesture.startY);
        const card = referenceCard(ref), id = ref.nodeId;
        registerNode(id, card, { kind: 'reference', anchorId: '', parsedTarget: ref.parsedTarget, ref });
        const record = nodeRecords.get(id); record.width = card.offsetWidth; record.height = card.offsetHeight;
        record.x = point.x - 100; record.y = point.y - 40;
        gesture.inlinePosition = { x: record.x, y: record.y };
        delete manualOffsets[id]; gesture.record = record; gesture.offsetX = 0; gesture.offsetY = 0;
      }
      recordInteraction();
      gesture.dragged = true; canvas.classList.add('dragging');
      if (gesture.record) {
        const record = gesture.record;
        manualOffsets[record.id] = { dx: gesture.offsetX + dx / view.z, dy: gesture.offsetY + dy / view.z };
        applyOffsets(); scheduleLines();
        if (record.ref && record.ref.user && canWrite) setDropTarget(connectionTargetAt(event.clientX, event.clientY, record.id));
      } else { view.x = gesture.x + dx; view.y = gesture.y + dy; applyView(); }
    });
    async function endPointer(event, canceled) {
      if (connection && connection.pointerId === event.pointerId) {
        const ended = connection; connection = null;
        const target = canceled ? '' : connectionTargetAt(event.clientX, event.clientY);
        if (canvas.hasPointerCapture(event.pointerId)) canvas.releasePointerCapture(event.pointerId);
        suppressClickUntil = Date.now() + 500; clearDropTarget(); scheduleLines();
        // Pulling the cable out and dropping it on the empty board disconnects; a plain click on the handle does not.
        const pulledOut = !canceled && !target && ended.moved && ended.record.ref.target && !offBoard(event.clientX, event.clientY);
        if (target || pulledOut) {
          try { await updateReferenceTarget(ended.record.ref, target); }
          catch (error) { toast(currentLabels.refFailed + ': ' + error.message); }
        }

      }
      if (!pointers.has(event.pointerId)) return;
      pointers.delete(event.pointerId);
      if (canvas.hasPointerCapture(event.pointerId)) canvas.releasePointerCapture(event.pointerId);
      if (pinch) {
        suppressClickUntil = Date.now() + 500;
        pinch = null;

      }

      const ended = gesture; gesture = null;
      canvas.classList.remove('dragging'); clearDropTarget();
      if (ended.dragged) {
        suppressClickUntil = Date.now() + 500;
        if (ended.record) {
          if (canceled && ended.inlineRef) { discardInlineDrag(ended); renderLatest(); return; }
          saveOffsets();
          const ref = ended.record.ref;
          const target = connectionTargetAt(event.clientX, event.clientY, ended.record.id);
          if (!canceled && ref && ref.user && canWrite && (target || ended.inlineRef)) {
            try {
              await updateReferenceTarget(ref, target);
            } catch (error) {
              toast(currentLabels.refFailed + ': ' + error.message);
              if (ended.inlineRef) discardInlineDrag(ended);
            }
          }
        }
      } else if (!canceled) {
        selectQuestion(ended.question || '');
        if (ended.record && ended.record.kind === 'report') openReader(ended.record.note.id);
        if (ended.record && ended.record.kind === 'sketch') openEnlargedSketch(ended.record.element.dataset.sketchId);
        if (ended.answerControl) {
          suppressClickUntil = Date.now() + 500; chooseAnswer(ended.question, ended.answerControl.dataset.answerOption);
          if (ended.answerControl.isConnected) ended.answerControl.focus({ preventScroll: true });

    canvas.addEventListener('pointerup', event => endPointer(event, false));

    canvas.addEventListener('click', event => {

    }, true);
    canvas.addEventListener('wheel', event => {
      if (event.target.closest('textarea, input')) return;
      event.preventDefault(); recordInteraction(); cancelGlide();

      else {
        const unit = event.deltaMode === 1 ? 16 : event.deltaMode === 2 ? window.innerHeight : 1;

    // Hit testing uses shown coordinates even while pointer capture hides the drop target.
    function offBoard(x, y) {
      if (x < 0 || y < 0 || x > window.innerWidth || y > window.innerHeight) return true;
      const top = document.elementFromPoint(x, y);
      return Boolean(top && top.closest('#spec-panel, #toolbar, #round-bar, #lightbox, #reader'));
    }
    function cardTargetAt(x, y, includeIdea, excludeId) {
      if (offBoard(x, y)) return '';
      const point = worldPoint(x, y);
      const ids = [...cardNodes.keys()].reverse(); if (includeIdea) ids.push(ideaId);
      for (const id of ids) {
        const record = nodeRecords.get(id);
        if (id !== excludeId && point.x >= record.x && point.x <= record.x + record.width && point.y >= record.y && point.y <= record.y + record.height) return id === ideaId ? 'idea' : id;
      }
      return '';
    }
    function questionAt(x, y, excludeId) { return cardTargetAt(x, y, false, excludeId); }
    function connectionTargetAt(x, y, excludeId) { return cardTargetAt(x, y, true, excludeId); }
    function clearDropTarget() {
      for (const card of cardNodes.values()) card.classList.remove('drop-target');
      const idea = nodeRecords.get(ideaId); if (idea) idea.element.classList.remove('drop-target');
    }
    function setDropTarget(id) {
      clearDropTarget(); const record = nodeRecords.get(id === 'idea' ? ideaId : id);
      if (record) record.element.classList.add('drop-target');
    }

    // Same-origin board API writes always carry the shared contract header.
    async function apiRequest(path, method, body, contentType) {
      if (!canWrite) throw new Error(currentLabels.needServer);
      const headers = { 'X-Grill-Board': '1' };
      if (typeof serverSession === 'string') headers['X-Grill-Session'] = encodeURIComponent(serverSession);
      const options = { method, headers, cache: 'no-store', credentials: 'same-origin' };
      if (body !== undefined) {
        headers['Content-Type'] = contentType || 'application/json';
        options.body = contentType ? body : JSON.stringify(body);
      }
      const response = await fetch(new URL(path, serverBaseUrl), options);
      if (response.status === 409) stopSession();
      let data;
      try { data = await response.json(); } catch (_) { throw new Error(response.statusText || String(response.status)); }
      if (!response.ok || !data || data.ok !== true) throw new Error(GrillSession.string(data && data.error) || response.statusText || String(response.status));
      return data;
    }
    async function detectServer() {
      if (!serverMode) return;
      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), 1000);
      try {
        const response = await fetch(new URL('api/ping', serverBaseUrl), { cache: 'no-store', credentials: 'same-origin', signal: controller.signal });
        const data = await response.json();
        const valid = response.ok && data.ok === true && data.board === 1 &&
          (!Object.prototype.hasOwnProperty.call(data, 'session') || typeof data.session === 'string');
        if (!valid) return;
        const identity = typeof data.session === 'string' ? data.session : null;
        if (serverSession !== undefined && identity !== serverSession) { stopSession(); return; }
        serverSession = identity; sessionChanged = false;
        canWrite = !hasSessionParameter;
      } catch (_) { /* Keep the last verified state; writes still carry the pinned session identity. */ }
      finally { clearTimeout(timeout); }
    }
    function stopSession() {
      sessionChanged = true; canWrite = false;
      // Controls disabled in place must be rebuilt when the original identity returns.
      lastRenderedJson = null;
      for (const record of nodeRecords.values()) record.signature = null;
      clearInterval(stepsTimer); stepsTimer = null;
      renderRoundBar();
      const notice = header.querySelector('.read-only-notice') || element('p', 'read-only-notice');
      notice.textContent = currentLabels.sessionChanged; header.append(notice);
      for (const editor of document.querySelectorAll('.answer-editor')) editor.readOnly = true;
      for (const button of document.querySelectorAll('.accept-recommendation, .delete-ref, button.ref-note')) button.disabled = true;
    }
    function transferUrl(transfer) {
      const lines = GrillSession.string(transfer.getData('text/uri-list')).split(/\r?\n/).map(line => line.trim()).filter(line => line && !line.startsWith('#'));
      return lines.map(GrillSession.singleWebUrl).find(Boolean) || GrillSession.singleWebUrl(transfer.getData('text/plain'));
    }
    async function addReference(file, url, target, position, failure = null) {
      if (failure) failure.querySelector('.retry-reference').disabled = true;
      try {
        let data;
        if (file) {
          if (!['image/png', 'image/jpeg', 'image/gif', 'image/webp'].includes(file.type)) { toast(currentLabels.badType); return; }
          const query = new URLSearchParams({ target, name: file.name || '' });
          data = await apiRequest('api/refs?' + query, 'POST', file, file.type);
        } else data = await apiRequest('api/refs', 'POST', { url, target });
        if (data.ref && data.ref.id && position) pendingDropPositions.set(GrillSession.nodeId('ref:user', data.ref.id), { x: position.x, y: position.y });
        if (failure) failure.remove();
        await loadFiles(); toast(currentLabels.refAdded);
      } catch (error) {
        if (!failure) {
          failure = element('div', 'reference-add-error floating');
          failure.append(element('p', '', currentLabels.refFailed), element('p', '', file ? file.name : url));
          failure.append(button(currentLabels.retryReference, currentLabels.retryReference, () => addReference(file, url, target, position, failure), 'retry-reference'));
          failure.append(button('×', currentLabels.close, () => failure.remove(), 'dismiss-reference'));
          document.getElementById('reference-add-errors').append(failure);
        }
        failure.querySelector('.retry-reference').disabled = false;
      }
    }
    let dragDepth = 0;
    window.addEventListener('dragenter', event => { event.preventDefault(); dragDepth++; dropHint.textContent = currentLabels.dropHint; dropHint.hidden = false; });
    window.addEventListener('dragover', event => {
      event.preventDefault();
      if (event.dataTransfer) event.dataTransfer.dropEffect = 'copy';
      dropHint.textContent = currentLabels.dropHint; dropHint.hidden = false;
      setDropTarget(questionAt(event.clientX, event.clientY));
    });
    window.addEventListener('dragleave', event => { event.preventDefault(); if (--dragDepth <= 0) { dragDepth = 0; dropHint.hidden = true; clearDropTarget(); } });
    window.addEventListener('drop', async event => {
      event.preventDefault(); dragDepth = 0; dropHint.hidden = true; clearDropTarget();
      const transfer = event.dataTransfer; if (!transfer) return;
      const files = Array.from(transfer.files || []), url = files.length ? '' : transferUrl(transfer);
      if (!files.length && !url) return;
      const target = questionAt(event.clientX, event.clientY), point = worldPoint(event.clientX, event.clientY);
      if (files.length) {
        for (let i = 0; i < files.length; i++) await addReference(files[i], '', target, target ? null : { x: point.x + i * 24, y: point.y + i * 24 });
      } else await addReference(null, url, target, target ? null : point);
    });
    window.addEventListener('paste', async event => {
      if (document.activeElement && document.activeElement.closest('input, textarea, [contenteditable="true"]')) return;
      const transfer = event.clipboardData; if (!transfer) return;
      const items = Array.from(transfer.items || []).filter(item => item.kind === 'file').map(item => item.getAsFile()).filter(Boolean);
      const files = items.length ? items : Array.from(transfer.files || []);
      const url = files.length ? '' : GrillSession.singleWebUrl(transfer.getData('text/plain'));
      if (!files.length && !url) return;
      event.preventDefault();
      const target = selectedQuestion;
      if (files.length) { for (const file of files) await addReference(file, '', target, null); }
      else await addReference(null, url, target, null);
    });

    // Poll both script globals together, preserving the last good session on errors.
    let failedReads = 0;
    let lastRenderedJson = null;
    let renderedCanWrite = false;
    let latestSession = null;
    let latestUser = null;
    let loading = null;
    let reloadRequested = false;
    function readScript(url, globalName) {
      return new Promise(resolve => {
        window[globalName] = undefined;
        const script = element('script');
        const address = new URL(url); address.searchParams.set('t', String(Date.now()));
        if (typeof serverSession === 'string') address.searchParams.set('grill-session', serverSession);
        script.src = address.href;
        let finished = false;
        const timeout = setTimeout(() => finish(null), 3000);
        function finish(value) {
          if (finished) return;
          finished = true; clearTimeout(timeout); script.remove(); resolve(value);
        }
        script.onload = () => {
          const data = window[globalName];
          if (!data || typeof data !== 'object' || Array.isArray(data)) { finish(null); return; }
          try { JSON.stringify(data); finish(data); } catch (_) { finish(null); }
        };
        script.onerror = () => finish(null);
        document.head.append(script);
      });
    }
    function renderLatest() {
      if (!latestSession || gesture || pinch || connection || nodeResize || document.querySelector('.note-editor')) return;
      const json = JSON.stringify([latestSession, latestUser, canWrite, sessionChanged]);
      if (json === lastRenderedJson) return;
      render(latestSession, latestUser); lastRenderedJson = json; renderedCanWrite = canWrite;
    }
    function loadFiles(force) {
      if (loading) {
        if (force !== false) reloadRequested = true;
        return loading;
      }
      loading = (async () => {
        do {
          reloadRequested = false;
          await detectServer();
          if (sessionChanged) return;
          const [session, user] = await Promise.all([readScript(sessionUrl, '__GRILL__'), readScript(userUrl, '__GRILL_USER__')]);
          await detectServer();
          if (sessionChanged) return;
          if (user) latestUser = user;
          if (session) { latestSession = session; failedReads = 0; warning.hidden = true; }
          else {
            failedReads++;
            if (failedReads >= 3) { warning.textContent = currentLabels.warnUnreadable + '\n' + sessionUrl; warning.hidden = false; }
          }
          renderLatest();
        } while (reloadRequested);
      })().finally(() => { loading = null; });
      return loading;
    }
    // A hand on the mouse means the user is reading: the view must not leave under it.
    window.addEventListener('pointermove', recordInteraction, { passive: true });
    applyView(); updateSpec();
    // The first render needs to know whether a server is behind the page: the round bar changes where the view lands.
    if (sessionUrl) detectServer().then(() => { loadFiles(); setInterval(() => loadFiles(false), 1000); });
    else { waiting.hidden = true; warning.textContent = currentLabels.invalidSession; warning.hidden = false; }
  </script>
